# This file contains the configuration for cleaning river data. It is used
# for preprocessing OSM river data, where certain members of river relations
# are modified by deleting specific nodes from their geometries.
# The keys in the config correspond to the names of the river relations,
# and the values are dictionaries mapping OSM-IDs of members to their
# respective modifications.
# The modifications are defined in the config as a list of either integers
# lists (which will be converted to python slices), specifying the indices
# of the nodes to be deleted for each member with a given OSM-ID. A slice
# is defined by a list of two integers, representing the start and stop
# indices. If the start index is null, it is interpreted as 0. If the stop
# index is null, it is interpreted as the length of the array. That means,
# a slice of [null, null] would delete all nodes of the member.
