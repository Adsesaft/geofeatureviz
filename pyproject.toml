[project]
name = "geofeatureviz"
version = "0.1.0"
description = "A Python library for visualizing geographical features such as countries, rivers, or mountains."
authors = [
    {name = "akuehn",email = "adrian-kuehn@posteo.de"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anki>=25.9.4",
    "beautifulsoup4>=4.14.3",
    "contourpy>=1.3.3",
    "geopandas>=1.1.3",
    "jupyter>=1.1.1",
    "lxml>=6.1.1",
    "matplotlib>=3.10.9",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "svg-py>=1.10.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.6.0",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "tabulate>=0.10.0",
    "types-geopandas>=1.1.3.20260518",
    "types-pyyaml>=6.0.12.20260518",
    "types-shapely>=2.1.0.20260518",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
