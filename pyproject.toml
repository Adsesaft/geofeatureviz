[project]
name = "geo_data"
version = "0.1.0"
description = "A template for Python projects created by Adrian Kühn."
authors = [
    {name = "akuehn",email = "adrian-kuehn@posteo.de"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anki>=25.9.4",
    "geopandas>=1.1.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pyyaml>=6.0.3",
    "svg-py>=1.10.0",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
extend-select = ["I"]
