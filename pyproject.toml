[project]
name = "geo_data"
version = "0.1.0"
description = "A template for Python projects created by Adrian Kühn."
authors = [
    {name = "akuehn",email = "adrian-kuehn@posteo.de"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anki>=25.9.4",
    "geopandas>=1.1.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pyyaml>=6.0.3",
    "svg-py>=1.10.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "types-geopandas>=1.1.3.20260518",
    "types-pyyaml>=6.0.12.20260518",
    "types-shapely>=2.1.0.20260518",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff.lint]
extend-select = ["I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
