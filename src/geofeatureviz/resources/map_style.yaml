styles:
  land:
    fill: land
    stroke: border
    stroke_width: 1
    stroke_linejoin: "round"

  other:
    fill: other
    stroke: border
    stroke_width: 1

  river:
    style: "fill:none"
    stroke: river
    stroke_width: 1
    stroke_linejoin: "round"

  lake:
    fill: lake
    stroke: river
    stroke_width: 1

  sea:
    fill: lake

  neutral_marker:
    style: "fill:none"
    fill: "none"
    stroke: "black"
    stroke_width: 1
    stroke_linejoin: "round"

  highlight_marker:
    fill: highlight
    fill_opacity: 0.2
    stroke: highlight
    stroke_width: 1
    stroke_linejoin: "round"
